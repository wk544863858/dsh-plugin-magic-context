name: CI

# Public CI: every push to main and every pull request runs the same gate on
# ubuntu-latest with the Node lines the package supports (>= 22.19; CI pins the
# latest 22.x and 24.x releases of those lines).
on:
  push:
    branches:
      - main
  pull_request:

# Read-only: this workflow only builds and tests. No token needs write access.
permissions:
  contents: read

# A newer push to the same branch supersedes the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # package-lock.json is the canonical lockfile; `npm ci` also fails loudly
      # when package.json and the lockfile have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check i18n dictionaries
        run: npm run check:i18n
