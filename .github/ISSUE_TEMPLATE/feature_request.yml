name: 功能建议 / Feature request
description: 提出一个新能力或改进建议
title: "[feat] "
body:
  - type: markdown
    attributes:
      value: |
        > 你提交的内容是公开的。请不要在这里贴密钥、私人会话内容或本机绝对路径。
        > 安全问题请走 [SECURITY.md](https://github.com/wk544863858/dsh-plugin-magic-context/blob/main/SECURITY.md)。
        > 中文或英文都可以，English is welcome too。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 现在哪里不够用、哪个场景卡住了？尽量描述真实使用场景，而不是只给方案。
      placeholder: |
        我希望在……场景下做到……，目前因为……做不到，只能……
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: 建议的方案 / Proposed solution
      description: 你设想的行为、配置项或界面。若涉及回收/historian/记忆/遥测等既有机制，请说明它应该接在哪里。
      placeholder: 我建议……（可附配置示例、伪代码、草图）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives considered
      description: 你考虑过但觉得不合适的做法，以及现有插件配置里凑合实现的变通办法。没有可填「无 / none」。
    validations:
      required: false
